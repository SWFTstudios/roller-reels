  <script>
// Load the Vimeo Player API
var script = document.createElement('script');
script.src = "https://player.vimeo.com/api/player.js";
document.head.appendChild(script);
// Store all players in an array
var players = [];
var syncThreshold = 0.1; // Adjust the sync sensitivity
var jumpThreshold = 1.5;
var jumpDeadTime = 500;
// Function to initialize players once Vimeo API is ready
script.onload = function() {
  document.querySelectorAll('.frame-item').forEach((item, index) => {
    let videoId = item.getAttribute('data-video-id'); // Get unique video ID
    let front = item.querySelector('.video.front'); // Get the front video container
    let back = item.querySelector('.video.back');   // Get the back video container
    // Create Vimeo iframe for front video
    let frontIframe = document.createElement('iframe');
    frontIframe.src = `https://player.vimeo.com/video/${videoId}?background=0&autoplay=1&muted=0&loop=1`;
    frontIframe.setAttribute('frameborder', '0');
    frontIframe.setAttribute('allowfullscreen', '');
    frontIframe.style.width = "100%";
    frontIframe.style.height = "100%";
    front.appendChild(frontIframe);
    // Create Vimeo iframe for back video (muted)
    let backIframe = document.createElement('iframe');
    backIframe.src = `https://player.vimeo.com/video/${videoId}?background=0&autoplay=1&muted=1&loop=1`;
    backIframe.setAttribute('frameborder', '0');
    backIframe.setAttribute('allowfullscreen', '');
    backIframe.style.width = "100%";
    backIframe.style.height = "100%";
    back.appendChild(backIframe);
    // Initialize Vimeo Players
    let player1 = new Vimeo.Player(frontIframe);
    let player2 = new Vimeo.Player(backIframe);
    // Ensure both players start at the same time
    Promise.all([player1.ready(), player2.ready()]).then(() => {
      player2.setCurrentTime(0); // Ensure sync from start
      player2.setVolume(0); // Keep background video muted
      syncTime(player1, player2);
    });
    // Store players in an array for later synchronization
    players.push({ player1, player2 });
  });
}
// Sync function for Vimeo players
function syncTime(player1, player2) {
  setInterval(async () => {
    let time1 = await player1.getCurrentTime();
    let time2 = await player2.getCurrentTime();
    let timeDiff = time2 - time1;
    if (Math.abs(timeDiff) > jumpThreshold) {
      console.log("Jumping: Difference is " + timeDiff + "s");
      player2.setCurrentTime(time1);
    } else if (timeDiff > syncThreshold) {
      player2.setPlaybackRate(0.9); // Slow down
      setTimeout(() => player2.setPlaybackRate(1), 500);
    } else if (timeDiff < -syncThreshold) {
      player2.setPlaybackRate(1.1); // Speed up
      setTimeout(() => player2.setPlaybackRate(1), 500);
    }
  }, 1000);
}
// Sync state changes (play/pause)
function syncStateChange(player1, player2) {
  player1.on('play', () => player2.play());
  player1.on('pause', () => player2.pause());
}
</script>
