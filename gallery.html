  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=692ebc79d55153a076f9bb6d" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script>
(function () {
  const API_URL = "/api/videos";
  const IFRAME_PARAMS =
    "title=0&byline=0&portrait=0&badge=0&autopause=0&autoplay=1&loop=1&muted=1";
  const LIGHTBOX_PARAMS =
    "autoplay=1&title=0&byline=0&portrait=0&badge=0";
  const DEFAULT_WIDTH = 1080;
  const DEFAULT_HEIGHT = 1920;

  function buildIframeSrc(embedBaseUrl) {
    if (!embedBaseUrl) return "";
    return embedBaseUrl + (embedBaseUrl.includes("?") ? "&" : "?") + IFRAME_PARAMS;
  }

  function buildLightboxIframeSrc(embedBaseUrl) {
    if (!embedBaseUrl) return "";
    return embedBaseUrl + (embedBaseUrl.includes("?") ? "&" : "?") + LIGHTBOX_PARAMS;
  }

  function buildLightboxHtml(embedBaseUrl) {
    const src = buildLightboxIframeSrc(embedBaseUrl);
    if (!src) return "";
    return (
      "<iframe src=\"" + src + "\" " +
      "width=\"100%\" height=\"100%\" frameborder=\"0\" " +
      "allow=\"autoplay; fullscreen; picture-in-picture\" " +
      "allowfullscreen title=\"Vimeo embed\"></iframe>"
    );
  }

  function buildLightboxJson(shareUrl, embedBaseUrl, width, height) {
    const safeShare = shareUrl || "";
    const w = width || DEFAULT_WIDTH;
    const h = height || DEFAULT_HEIGHT;

    return {
      items: [
        {
          url: safeShare,
          originalUrl: safeShare,
          width: w,
          height: h,
          thumbnailUrl: "",
          html: buildLightboxHtml(embedBaseUrl),
          type: "video",
        },
      ],
      group: "",
    };
  }

  async function load() {
    const items = Array.from(document.querySelectorAll(".carousel-container .carousel > a.carousel-item"));
    if (!items.length) return;

    const res = await fetch(API_URL, { headers: { accept: "application/json" } });
    if (!res.ok) return;
    const data = await res.json();
    const cmsItems = Array.isArray(data?.items) ? data.items : [];
    const top4 = cmsItems.slice(0, 4);
    if (top4.length < 1) return;

    const expanded = [];
    for (let i = 0; i < 8; i++) expanded.push(top4[i % top4.length]);

    items.forEach((el, idx) => {
      const record = expanded[idx];
      if (!record) return;

      const title = record.title || "";
      const shareUrl = record?.vimeo?.shareUrl || "";
      const embedBaseUrl = record?.vimeo?.embedBaseUrl || "";
      const width = record?.vimeo?.width;
      const height = record?.vimeo?.height;

      const h1 = el.querySelector(".carousel_item_title");
      if (h1) h1.textContent = title;

      const iframe = el.querySelector("iframe");
      if (iframe) {
        iframe.src = buildIframeSrc(embedBaseUrl);
        iframe.title = title;
      }

      const jsonScript = el.querySelector("script.w-json");
      if (jsonScript) {
        jsonScript.textContent = JSON.stringify(
          buildLightboxJson(shareUrl, embedBaseUrl, width, height)
        );
      }

      // Keep link from navigating
      el.setAttribute("href", "#");
    });

    // Re-initialize Webflow lightbox after swapping JSON
    try {
      if (window.Webflow && typeof window.Webflow.require === "function") {
        const lb = window.Webflow.require("lightbox");
        if (lb && typeof lb.ready === "function") lb.ready();
      }
    } catch (_) {}
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", load);
  } else {
    load();
  }
})();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script>
$(document).ready(function () {
  const items = $(".carousel-item");
  let currentIndex = 4;
  let isAnimating = false;
  CustomEase.create("customEase", ".06,.39,.95,-0.06");
  let touchStartY = 0;
  let touchEndY = 0;

  function updateCarousel() {
    items.each(function (index) {
      let newIndex = (index - currentIndex + items.length) % items.length;
      let zIndexClass;
      switch (newIndex) {
        case 0: zIndexClass = "center"; break;
        case 1: case 7: zIndexClass = "z1"; break;
        case 2: case 6: zIndexClass = "z2"; break;
        case 3: case 5: zIndexClass = "z3"; break;
        case 4: default: zIndexClass = ""; break;
      }
      $(this).removeClass("center z3 z2 z1").addClass(zIndexClass);
      let bgColor = "#" + $(".center").attr("data-bg-color");
      $(".carousel-container").css("background-color", bgColor);
      let yPercent = newIndex <= 3 ? newIndex * 25 : (newIndex - 8) * 25;
      gsap.to(this, {
        duration: 0.4,
        ease: "customEase",
        y: yPercent + "%",
        scale: getScale(newIndex),
        zIndex: getZIndex(newIndex),
        onComplete: function () {
          if (newIndex === 1 || newIndex === 7) $(this).removeClass("z3");
          if (newIndex === 2 || newIndex === 6) $(this).removeClass("z2");
          if (newIndex === 3 || newIndex === 5) $(this).removeClass("z1");
          setTimeout(function () { isAnimating = false; }, 500);
        },
      });
    });
  }
  function getScale(index) {
    switch (index) {
      case 0: return 1;
      case 1: case 7: return 0.9;
      case 2: case 6: return 0.8;
      case 3: case 5: case 4: default: return 0.7;
    }
  }
  function getZIndex(index) {
    switch (index) {
      case 0: return 4;
      case 1: case 7: return 3;
      case 2: case 6: return 2;
      case 3: case 5: return 1;
      case 4: default: return 0;
    }
  }

  $(window).on("wheel", function (e) {
    if (isAnimating) return;
    isAnimating = true;
    if (e.originalEvent.deltaY > 0) currentIndex = (currentIndex + 1) % items.length;
    else currentIndex = (currentIndex - 1 + items.length) % items.length;
    updateCarousel();
  });
  $(".carousel-container").on("touchstart", function (e) {
    touchStartY = e.originalEvent.touches[0].clientY;
  });
  $(".carousel-container").on("touchmove", function (e) {
    touchEndY = e.originalEvent.touches[0].clientY;
  });
  $(".carousel-container").on("touchend", function () {
    if (isAnimating) return;
    isAnimating = true;
    if (touchEndY < touchStartY) currentIndex = (currentIndex + 1) % items.length;
    else if (touchEndY > touchStartY) currentIndex = (currentIndex - 1 + items.length) % items.length;
    updateCarousel();
  });

  updateCarousel();
});
</script>
